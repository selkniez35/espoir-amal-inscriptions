name: Symfony Preprod CI

on:
    push:
        tags:
            - 'v*.*.*'

jobs:
    ci:
        runs-on: ubuntu-latest

        services:
            mysql:
                image: mysql:8
                env:
                    MYSQL_ROOT_PASSWORD: root
                    MYSQL_DATABASE: espoir_amal_test
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping --silent"
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=10

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            # =========================
            # TAG SECURITY CHECK
            # =========================
            - name: Verify tag source branch
              run: |
                  git fetch origin develop
                  if ! git branch -r --contains $GITHUB_SHA | grep origin/develop; then
                    echo "❌ Tag must come from develop branch"
                    exit 1
                  fi

            # =========================
            # PHP SETUP
            # =========================
            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: 8.4
                  extensions: mbstring, intl, pdo_mysql, opcache
                  coverage: none

            # =========================
            # COMPOSER
            # =========================
            - name: Validate composer
              run: composer validate

            - name: Install dependencies
              run: composer install --no-interaction --prefer-dist --no-progress

            # =========================
            # ENV SETUP (IMPORTANT FIX)
            # =========================
            - name: Setup environment
              run: |
                  echo "APP_ENV=test" >> .env
                  echo "APP_DEBUG=0" >> .env
                  echo "DATABASE_URL=mysql://root:root@127.0.0.1:3306/espoir_amal_test?serverVersion=8.0" >> .env
                  echo "DEFAULT_URI=http://localhost" >> .env
                  echo "APP_SECRET=ci_secret" >> .env

            # =========================
            # WAIT MYSQL
            # =========================
            - name: Wait for MySQL
              run: |
                  until mysqladmin ping -h"127.0.0.1" --silent; do
                    sleep 1
                  done

            # =========================
            # SYMFONY VALIDATION
            # =========================
            - name: Symfony lint container
              run: php bin/console lint:container

            - name: Symfony lint twig
              run: php bin/console lint:twig templates

            - name: Symfony lint yaml
              run: php bin/console lint:yaml config

            - name: Symfony about
              run: php bin/console about

            # =========================
            # CACHE + DB
            # =========================
            - name: Cache clear
              run: php bin/console cache:clear --env=test

            - name: Create DB
              run: php bin/console doctrine:database:create --if-not-exists --env=test

            - name: Migrations
              run: php bin/console doctrine:migrations:migrate --no-interaction --env=test

            # =========================
            # QUALITY TOOLS
            # =========================
            - name: PHPStan
              run: |
                  if [ -f vendor/bin/phpstan ]; then
                    vendor/bin/phpstan analyse src --level=6
                  fi

            - name: PHP-CS-Fixer
              run: |
                  if [ -f vendor/bin/php-cs-fixer ]; then
                    vendor/bin/php-cs-fixer fix --dry-run --diff
                  fi

            # =========================
            # TESTS
            # =========================
            - name: PHPUnit
              run: php bin/phpunit --fail-on-warning --fail-on-risky
