name: CI

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: test
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/test_db

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------- PHP ----------------
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql, xml, ctype, iconv
          coverage: none

      # ---------------- CACHE ----------------
      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}

      # ---------------- INSTALL ----------------
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # ---------------- SYMFONY CHECKS ----------------
      - name: Lint container
        run: php bin/console lint:container --env=test

      - name: Lint Twig
        run: php bin/console lint:twig templates

      - name: Lint YAML
        run: php bin/console lint:yaml config

      # ---------------- DATABASE ----------------
      - name: Wait for MySQL
        run: |
          until mysqladmin ping -h 127.0.0.1 -proot --silent; do
            echo "Waiting for MySQL..."
            sleep 2
          done

      - name: Run migrations
        run: php bin/console doctrine:migrations:migrate --no-interaction --env=test

      - name: Doctrine schema validate
        run: php bin/console doctrine:schema:validate --skip-sync --env=test

      # ---------------- CACHE ----------------
      - name: Warmup cache
        run: php bin/console cache:warmup --env=test

      # ---------------- TESTS ----------------
      - name: Run tests
        run: vendor/bin/phpunit

      # ---------------- STATIC ANALYSIS ----------------
      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress || true

      # ---------------- SECURITY ----------------
      - name: Security check
        run: composer audit || true
