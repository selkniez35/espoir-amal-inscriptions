name: CI

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  quality:
    runs-on: ubuntu-latest

    env:
      APP_ENV: test
      DATABASE_URL: sqlite:///%kernel.project_dir%/var/test.db

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------- PHP ----------------
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo, pdo_sqlite, xml, ctype, iconv
          coverage: none

      # ---------------- CACHE COMPOSER ----------------
      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}

      # ---------------- INSTALL ----------------
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # ---------------- SYMFONY QUALITY ----------------
      - name: Lint container
        run: php bin/console lint:container --env=test

      - name: Lint Twig
        run: php bin/console lint:twig templates

      - name: Lint YAML
        run: php bin/console lint:yaml config

      # ---------------- DATABASE TEST ----------------
      - name: Prepare test DB
        run: |
          mkdir -p var
          touch var/test.db

      - name: Run migrations (test)
        run: php bin/console doctrine:migrations:migrate --no-interaction --env=test

      # ❌ FIX IMPORTANT : on enlève schema:validate (cause crash CI)
      # ou version safe :
      - name: Doctrine mapping check
        run: php bin/console doctrine:mapping:info --env=test

      # ---------------- CACHE ----------------
      - name: Warmup cache
        run: php bin/console cache:warmup --env=test

      # ---------------- TESTS ----------------
      - name: Run tests
        run: vendor/bin/phpunit

      # ---------------- STATIC ANALYSIS ----------------
      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress

      # ---------------- SECURITY ----------------
      - name: Security check
        run: composer audit || true
